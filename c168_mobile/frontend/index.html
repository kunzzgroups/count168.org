<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EazyCount" />
    <meta name="theme-color" content="#004ff9" />
    <link rel="manifest" href="/c168_mobile/frontend/dist/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/c168_mobile/frontend/dist/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/c168_mobile/frontend/dist/icons/icon-192.png" />
    <title>C168 Mobile</title>
    <script>
      try {
        if (localStorage.getItem("login_theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) {}
    </script>
    <script>
      /* Android shell (Capacitor) is edge-to-edge: the WebView viewport spans the
         whole screen, so bottom-fixed UI ends up behind the system nav bar and
         env(safe-area-inset-bottom) stays 0 in the WebView. Detect that case and
         lift bottom chrome by one nav-bar height (48px) via --m-inset-b.
         Portrait only — in landscape the nav bar sits on the side. A shell that
         already insets the WebView reports innerHeight < screen.height and gets
         no lift, so this never double-pads a fixed build. */
      (function () {
        var update = function () {
          try {
            var cap = window.Capacitor;
            var native = !!(cap && cap.isNativePlatform && cap.isNativePlatform());
            var fullBleed =
              native &&
              window.screen &&
              window.screen.height - window.innerHeight < 8 &&
              window.matchMedia("(orientation: portrait)").matches;
            document.documentElement.style.setProperty(
              "--m-inset-b",
              fullBleed ? "48px" : "0px"
            );
          } catch (e) {}
        };
        update();
        window.addEventListener("resize", update);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
