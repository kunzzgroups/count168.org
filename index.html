<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="images/count_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Amaranth:wght@400;700&display=swap"

    <title>EazyCount</title>
    <script type="module" crossorigin src="/assets/index-gFzszqJt.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Jsy2SE0X.css">
  </head>
  <body>
    <div id="root"></div>
    <noscript>此应用需要开启 JavaScript。请启用后刷新页面。</noscript>
    <script>
      window.addEventListener('load', function () {
        requestAnimationFrame(function () {
          var r = document.getElementById('root')
          if (r && !r.hasChildNodes()) {
            r.innerHTML =
              '<p style="padding:1.5rem;font-family:system-ui,sans-serif;max-width:40rem;font-size:14px;line-height:1.5;color:#9a3412;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px">' +
              '<strong>主脚本可能未成功运行。</strong> 请 F12 打开「网络(Network)」刷新本页，检查 <code>/assets/index-*.js</code> 与 <code>/assets/index-*.css</code> 是否为 <strong>200</strong>。' +
              ' 若为 404，请在项目内执行 <code>npm run build:site</code>，将网站根目录的 <code>index.html</code> 与 <code>assets/</code> 整包上传。' +
              ' 若服务器使用 <strong>Nginx</strong>，需在 location / 中配置 <code>try_files $uri $uri/ /index.html;</code>（仅 Apache 的 .htaccess 不会生效）。' +
              '</p>'
          }
        })
      })
    </script>
  </body>
</html>
