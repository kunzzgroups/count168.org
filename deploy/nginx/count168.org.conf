# count168 — Nginx org config (方案 A: 整站根目录 + frontend/dist/)
#
# 用法:
#   1. 把本文件复制到服务器，例如 /etc/nginx/sites-available/count168.org
#   2. 修改 root、server_name、fastcgi_pass
#   3. ln -s /etc/nginx/sites-available/count168.org /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#
# 网站文件应上传到 root 所指目录，结构示例:
#   /var/www/count168.org/
#   ├── api/
#   ├── includes/
#   ├── frontend/dist/    ← npm run build 产物
#   ├── images/
#   ├── js/
#   └── favicon.ico

server {
    listen 80;
    # listen 443 ssl http2;   # 启用 HTTPS 时取消注释并配置证书
    server_name count168.org www.count168.org;

    root /var/www/count168.org;
    index index.html;

    client_max_body_size 64M;

    # --- 压缩（JS/CSS/JSON 体积可降 60%+）---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        font/woff
        font/woff2;

    # --- 根路径 -> 登录 ---
    location = / {
        return 302 /login;
    }

    # --- 旧版 .php / 下划线 URL -> 干净路径 (302) ---
    location = /index.php              { return 302 /login; }
    location = /dashboard.php          { return 302 /dashboard; }
    location = /domain.php             { return 302 /domain; }
    location = /announcement.php       { return 302 /announcement; }
    location = /account-list.php       { return 302 /account-list; }
    location = /add-account.php        { return 302 /add-account; }
    location = /processlist.php        { return 302 /process-list; }
    location = /games_process_list.php { return 302 /games-process-list; }
    location = /bank_process_list.php  { return 302 /bank-process-list; }
    location = /userlist.php           { return 302 /userlist; }
    location = /useraccess.php         { return 302 /useraccess; }
    location = /deleted-log.php        { return 302 /deleted-log$is_args$args; }
    location = /deleted_log.php         { return 302 /deleted-log$is_args$args; }
    location = /ownership.php          { return 302 /ownership; }
    location = /transaction.php        { return 302 /transaction; }
    location = /customer_report.php    { return 302 /customer-report; }
    location = /domain_report.php      { return 302 /domain-report; }
    location = /capture_maintenance.php    { return 302 /capture-maintenance; }
    location = /transaction_maintenance.php { return 302 /transaction-maintenance; }
    location = /formula_maintenance.php    { return 302 /formula-maintenance; }
    location = /bankprocess_maintenance.php { return 302 /bankprocess-maintenance; }
    location = /payment_maintenance.php    { return 302 /payment-maintenance; }
    location = /auto_renew.php         { return 302 /auto-renew; }
    location = /auto-renew.php           { return 302 /auto-renew; }
    location = /customer_report          { return 302 /customer-report; }
    location = /domain_report            { return 302 /domain-report; }
    location = /capture_maintenance      { return 302 /capture-maintenance; }
    location = /transaction_maintenance  { return 302 /transaction-maintenance; }
    location = /formula_maintenance      { return 302 /formula-maintenance; }
    location = /bankprocess_maintenance  { return 302 /bankprocess-maintenance; }
    location = /payment_maintenance      { return 302 /payment-maintenance; }
    location = /owner_secondary_password.php { return 302 /owner-secondary-password; }
    location = /user_secondary_password.php  { return 302 /user-secondary-password; }
    location = /reset-password.php       { return 302 /reset-password; }
    location = /api/users/user_secondary_password.php { return 302 /user-secondary-password; }
    location = /member.php               { return 302 /member; }
    location = /datacapture.php          { return 302 /datacapture$is_args$args; }
    location = /datacapturesummary.php   { return 302 /datacapturesummary$is_args$args; }
    location = /transcation              { return 302 /transaction; }

    # --- 特殊内部路由 (对应 .htaccess [L] 规则) ---
    location = /domainapi.php {
        rewrite ^ /api/domain/domain_api.php last;
    }

    location = /logout {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/session/logout_api.php;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    # --- Vite 带 hash 的 JS/CSS：长期缓存 ---
    location ^~ /frontend/dist/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- 构建后的页面 CSS（HTML 里带 ?v= 版本号）---
    location ^~ /frontend/dist/css/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /frontend/dist/index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # --- React 静态资源 (base: /frontend/dist/) ---
    location /frontend/dist/ {
        try_files $uri $uri/ /frontend/dist/index.html;
    }

    # --- 根目录静态资源 ---
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location /js/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
    }

    # --- PHP API ---
    location ^~ /api/ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # --- 其余 .php (cron 脚本等，按需限制访问) ---
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    # --- SPA 路由 -> index.html (与 .htaccess 末尾规则一致) ---
    location ~ ^/(login|member|reset-password|dashboard|domain|announcement|auto-renew|account-list|add-account|process-list|games-process-list|bank-process-list|userlist|useraccess|ownership|owner-secondary-password|user-secondary-password|datacapture|datacapturesummary|transaction|customer-report|domain-report|capture-maintenance|transaction-maintenance|formula-maintenance|bankprocess-maintenance|payment-maintenance|deleted-log)$ {
        try_files /frontend/dist/index.html =404;
    }

    # --- 隐藏敏感目录 ---
    location ~ ^/(includes|database|\.git) {
        deny all;
        return 404;
    }
}
