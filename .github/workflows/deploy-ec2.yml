name: Deploy org to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-org:
    name: count168.org
    runs-on: ubuntu-latest
    steps:
      - name: Verify EC2 secrets
        run: |
          missing=0
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "::error::EC2_HOST secret is missing on count168.org repo"
            missing=1
          fi
          if [ -z "${{ secrets.EC2_USER }}" ]; then
            echo "::error::EC2_USER secret is missing on count168.org repo"
            missing=1
          fi
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "::error::EC2_SSH_KEY secret is missing on count168.org repo"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Add the same secrets used by kunzzgroups/count168test:"
            echo "  Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "  EC2_HOST, EC2_USER, EC2_SSH_KEY"
            exit 1
          fi
      - name: SSH deploy to /var/www/count168.org
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m
          debug: true
          script: |
            set -euo pipefail
            APP_ROOT=/var/www/count168.org
            REPO_URL="https://github.com/kunzzgroups/count168.org.git"
            bootstrap_org_repo() {
              echo "==> bootstrapping ${APP_ROOT} (first-time git clone)"
              CONFIG_BAK=""
              if [[ -f "${APP_ROOT}/includes/config.local.php" ]]; then
                CONFIG_BAK="$(mktemp)"
                cp "${APP_ROOT}/includes/config.local.php" "$CONFIG_BAK"
              fi
              sudo mkdir -p "$(dirname "$APP_ROOT")"
              if [[ -d "$APP_ROOT" ]] && [[ -n "$(ls -A "$APP_ROOT" 2>/dev/null || true)" ]]; then
                sudo mv "$APP_ROOT" "${APP_ROOT}.bak.$(date +%s)"
              fi
              sudo git clone --branch main --depth 1 "$REPO_URL" "$APP_ROOT"
              if ! sudo chown -R "$(whoami):nginx" "$APP_ROOT"; then
                sudo chown -R "$(whoami):$(id -gn)" "$APP_ROOT"
              fi
              if [[ -n "$CONFIG_BAK" && -f "$CONFIG_BAK" ]]; then
                cp "$CONFIG_BAK" "${APP_ROOT}/includes/config.local.php"
                rm -f "$CONFIG_BAK"
              fi
            }
            if [[ ! -d "${APP_ROOT}/.git" ]]; then
              bootstrap_org_repo
            fi
            ORG_DEPLOY=""
            for candidate in \
              "${APP_ROOT}/deploy/deploy-org.sh" \
              "/var/www/count168/deploy/deploy-org.sh"; do
              if [[ -f "$candidate" ]]; then
                ORG_DEPLOY="$candidate"
                break
              fi
            done
            if [[ -n "$ORG_DEPLOY" ]]; then
              bash "$ORG_DEPLOY"
            else
              echo "==> fallback: git pull ${APP_ROOT} (deploy-org.sh not found)"
              cd "$APP_ROOT"
              git fetch origin main
              git reset --hard origin/main
              if command -v chcon >/dev/null 2>&1; then
                chcon -R -t httpd_sys_content_t "$APP_ROOT" 2>/dev/null || true
              fi
              if systemctl is-active --quiet nginx 2>/dev/null; then
                sudo systemctl reload nginx || true
              fi
              echo "==> org deploy OK (fallback)"
            fi
