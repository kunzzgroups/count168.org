name: Deploy org to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  EC2_HOST: "56.68.48.190"
  EC2_USER: "ec2-user"

jobs:
  deploy-org:
    name: count168.org
    runs-on: ubuntu-latest
    steps:
      - name: Verify EC2 SSH key secret
        run: |
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "::error::EC2_SSH_KEY secret is missing on count168.org repo"
            echo "Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "Name: EC2_SSH_KEY"
            echo "Value: full Server_Key.pem (BEGIN ... END lines)"
            exit 1
          fi
          key="${{ secrets.EC2_SSH_KEY }}"
          if ! printf '%s' "$key" | grep -q 'BEGIN.*PRIVATE KEY'; then
            echo "::error::EC2_SSH_KEY does not look like a PEM private key"
            exit 1
          fi
          echo "EC2 target: ${{ env.EC2_USER }}@${{ env.EC2_HOST }}"
      - name: SSH deploy to /var/www/count168.org
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m
          debug: true
          script: |
            set -euo pipefail
            echo "==> SSH OK: user=$(whoami) host=$(hostname)"
            APP_ROOT=/var/www/count168.org
            run_bootstrap() {
              for bootstrap in \
                "${APP_ROOT}/deploy/bootstrap-org-repo.sh" \
                "/var/www/count168/deploy/bootstrap-org-repo.sh"; do
                if [[ -f "$bootstrap" ]]; then
                  APP_ROOT="$APP_ROOT" bash "$bootstrap"
                  return 0
                fi
              done
              echo "==> fetching bootstrap-org-repo.sh from GitHub main"
              curl -fsSL "https://raw.githubusercontent.com/kunzzgroups/count168.org/main/deploy/bootstrap-org-repo.sh" \
                | APP_ROOT="$APP_ROOT" bash
            }
            if [[ ! -d "${APP_ROOT}/.git" ]]; then
              run_bootstrap
            fi
            ORG_DEPLOY=""
            for candidate in \
              "${APP_ROOT}/deploy/deploy-org.sh" \
              "/var/www/count168/deploy/deploy-org.sh"; do
              if [[ -f "$candidate" ]]; then
                ORG_DEPLOY="$candidate"
                break
              fi
            done
            if [[ -n "$ORG_DEPLOY" ]]; then
              bash "$ORG_DEPLOY" || {
                echo "ERROR: deploy-org.sh failed (exit $?)"
                echo "On EC2 run: cd $APP_ROOT && bash deploy/deploy-org.sh"
                exit 1
              }
            else
              echo "==> fallback: git pull ${APP_ROOT} (deploy-org.sh not found)"
              cd "$APP_ROOT"
              git fetch origin main
              git reset --hard origin/main
              if command -v chcon >/dev/null 2>&1; then
                chcon -R -t httpd_sys_content_t "$APP_ROOT" 2>/dev/null || true
              fi
              if systemctl is-active --quiet nginx 2>/dev/null; then
                sudo systemctl reload nginx || true
              fi
              echo "==> org deploy OK (fallback)"
            fi
