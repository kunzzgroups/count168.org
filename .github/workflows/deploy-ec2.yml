name: Deploy org to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-org:
    name: count168.org
    runs-on: ubuntu-latest
    steps:
      - name: Verify EC2 secrets
        run: |
          missing=0
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "::error::EC2_HOST secret is missing on count168.org repo"
            missing=1
          fi
          if [ -z "${{ secrets.EC2_USER }}" ]; then
            echo "::error::EC2_USER secret is missing on count168.org repo"
            missing=1
          fi
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "::error::EC2_SSH_KEY secret is missing on count168.org repo"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Add the same secrets used by kunzzgroups/count168test:"
            echo "  Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "  EC2_HOST, EC2_USER, EC2_SSH_KEY"
            exit 1
          fi
          key="${{ secrets.EC2_SSH_KEY }}"
          if ! printf '%s' "$key" | grep -q 'BEGIN.*PRIVATE KEY'; then
            echo "::error::EC2_SSH_KEY does not look like a PEM private key (missing BEGIN ... PRIVATE KEY)"
            echo "Paste the full .pem file from AWS, including the first and last line."
            exit 1
          fi
          host="${{ secrets.EC2_HOST }}"
          if printf '%s' "$host" | grep -qiE '[a-z]'; then
            echo "::warning::EC2_HOST looks like a hostname ($host). Use the EC2 public IPv4, not count168.org."
          fi
      - name: SSH deploy to /var/www/count168.org
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m
          debug: true
          script: |
            set -euo pipefail
            APP_ROOT=/var/www/count168.org
            run_bootstrap() {
              for bootstrap in \
                "${APP_ROOT}/deploy/bootstrap-org-repo.sh" \
                "/var/www/count168/deploy/bootstrap-org-repo.sh"; do
                if [[ -f "$bootstrap" ]]; then
                  APP_ROOT="$APP_ROOT" bash "$bootstrap"
                  return 0
                fi
              done
              echo "==> fetching bootstrap-org-repo.sh from GitHub main"
              curl -fsSL "https://raw.githubusercontent.com/kunzzgroups/count168.org/main/deploy/bootstrap-org-repo.sh" \
                | APP_ROOT="$APP_ROOT" bash
            }
            if [[ ! -d "${APP_ROOT}/.git" ]]; then
              run_bootstrap
            fi
            ORG_DEPLOY=""
            for candidate in \
              "${APP_ROOT}/deploy/deploy-org.sh" \
              "/var/www/count168/deploy/deploy-org.sh"; do
              if [[ -f "$candidate" ]]; then
                ORG_DEPLOY="$candidate"
                break
              fi
            done
            if [[ -n "$ORG_DEPLOY" ]]; then
              bash "$ORG_DEPLOY"
            else
              echo "==> fallback: git pull ${APP_ROOT} (deploy-org.sh not found)"
              cd "$APP_ROOT"
              git fetch origin main
              git reset --hard origin/main
              if command -v chcon >/dev/null 2>&1; then
                chcon -R -t httpd_sys_content_t "$APP_ROOT" 2>/dev/null || true
              fi
              if systemctl is-active --quiet nginx 2>/dev/null; then
                sudo systemctl reload nginx || true
              fi
              echo "==> org deploy OK (fallback)"
            fi
